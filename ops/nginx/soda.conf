server {
    listen 80;
    server_name soda567.dpdns.org admin.soda567.dpdns.org api.soda567.dpdns.org media.soda567.dpdns.org;

    location /admin {
        proxy_pass http://127.0.0.1:5003/admin;
        proxy_set_header Host $host;
    }

    location /api/transcribe {
        # 5001 owns uploads, R2, Douyin, cancellation and task-id mapping.
        # 5003 is a private Whisper worker and must never receive public uploads directly.
        proxy_pass http://127.0.0.1:5001/api/transcribe;
        proxy_set_header Host $host;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location /api/status {
        proxy_pass http://127.0.0.1:5001/api/status;
        proxy_set_header Host $host;
    }

    location /api/music/ {
        proxy_pass http://127.0.0.1:5062/api/music/;
        proxy_set_header Host $host;
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_request_buffering on;
        # The application owns CORS. Do not duplicate allow-origin here.
    }

    location /api/health {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/upload_chunk {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_request_buffering on;
    }

    location /api/merge_chunks {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_request_buffering on;
    }

    location /media/web-videos/ {
        alias /Volumes/SodaMedia/Media/web-videos/;
        types { video/mp4 mp4; }
        default_type video/mp4;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=14400" always;
    }

    location /web-videos/ {
        alias /Volumes/SodaMedia/Media/web-videos/;
        types { video/mp4 mp4; }
        default_type video/mp4;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=14400" always;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:5001/media/;
        proxy_set_header Host $host;
    }

    location /videos/ {
        proxy_pass http://127.0.0.1:5001/media/videos/;
        proxy_set_header Host $host;
    }

    location /thumbnails/ {
        proxy_pass http://127.0.0.1:5001/media/thumbnails/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }
}
